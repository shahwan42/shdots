# Cloud-init for a dev VM — one template, every dev box (fdx-dev on the work Host,
# as-dev on the personal Host). Nothing here is machine-specific: identity comes from
# the multipass --name flag; boxes reach each other and the Mac by <name>.local
# (avahi/mDNS), not Tailscale (Phase 2 — dev boxes dropped Tailscale; it remains
# prod-only, see docs/plans/fleet-topology.md D7).
#
# NOT a chezmoi template — `provision` is excluded in .chezmoiignore.tmpl, so
# chezmoi never renders or applies this. The `@@`-delimited placeholders are
# substituted by a launcher script at launch time (today: provision/launch-dev-vm.sh,
# called by provision/new-box — the supported entry point for a new box). One
# placeholder is provider-neutral by design: it's either "gateway" (Multipass) or
# "none" (a future non-Multipass/VPS launcher would leave it this way), and picks
# whether the Mac-bridge firewall allow rule below is on — see the docker-user-fw.sh
# write_files entry.
#
#   ./launch-dev-vm.sh as-dev                 # personal VM, defaults below
#   ./launch-dev-vm.sh fdx-dev                # work VM, same spec
#
# NOTE: `package_upgrade: true` means two launches weeks apart get different package
# sets — "reproducible" here means same shape, not bit-identical.
#
# Deliberately NOT in this file (interactive or decision-gated):
#   - chezmoi bootstrap + role/kind answers (prompts; provision/new-box answers them
#     non-interactively — see provision/README.md)
#   - age identity, SSH keys                (secrets, seeded out-of-band by new-box)
#   - PHP/Node versions via mise             (pinned from the repo's constraints after clone)
#
# GitHub tokens for mise are no longer a manual step: the managed
# ~/.config/zsh/secrets.zsh pulls them from 1Password once the age identity and
# the age-encrypted 1Password service-account token are on the box (both copied/
# decrypted during chezmoi apply, out of band from this file).

timezone: Africa/Cairo

# Direct SSH from the Host (ubuntu@<vm-ip>) — do not depend on `multipass exec`:
# with Docker installed in the guest, the multipass client can pick the docker0
# bridge IP (172.17.0.1) and fail with "No route to host". Field-tested 2026-08-25.
# Both workstation public keys (.chezmoidata/fleet.yaml) are authorized, not just
# the launching Mac's — either workstation may need to reach any dev box.
ssh_authorized_keys:
  - @@AS_HOST_PUBKEY@@
  - @@FDX_HOST_PUBKEY@@

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - build-essential
  - ufw
  - chrony
  # <name>.local resolution from the Mac (D7/D16 — Multipass dev boxes use plain
  # SSH over mDNS, not Tailscale). Verified 2026-09-22: Multipass's default ufw
  # rules already allow mDNS, so no extra ufw rule is needed for this.
  - avahi-daemon
  # provides add-apt-repository, used below for the Eternal Terminal PPA
  - software-properties-common
  # zsh is the login shell on every machine class (dot_zshrc.tmpl is applied
  # unconditionally). Installing it here means a fresh VM is not stuck on bash
  # waiting for a manual apt install + chsh.
  - zsh
  # Headless-chromium runtime libs. mermaid-cli (mmdc) renders through
  # Playwright's arm64 chromium and that binary is dynamically linked against
  # these. Without them mmdc fails at launch, not at install.
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libatspi2.0-0t64
  - libcups2t64
  - libasound2t64
  - libgbm1
  - libcairo2
  - libpango-1.0-0
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2

swap:
  filename: /swapfile
  size: 6G
  maxsize: 6G

apt:
  sources:
    docker:
      source: "deb [signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

write_files:
  # Security updates only is the Ubuntu default; never auto-reboot — a surprise
  # reboot takes down the whole stack (see architecture doc, Day-2 operations).
  - path: /etc/apt/apt.conf.d/51-no-auto-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
  # ufw does NOT filter Docker-published ports (they bypass INPUT via DOCKER chains),
  # and iptables rules don't survive a reboot, so this reconciles the DOCKER-USER
  # chain (and, on Multipass, et's ufw rule) every boot rather than once at
  # cloud-init time. See docker-user-fw.service below for why this runs as a unit
  # instead of inline in runcmd.
  # No `permissions:` field here on purpose: Multipass re-serializes this file
  # before cloud-init sees it, and round-tripping through its YAML encoder drops
  # the quotes around an octal-looking string like "0755" — cloud-init then
  # reads the bare number 493 and fails schema validation (field-tested
  # 2026-09-25, `cloud-init status --long` -> degraded, `cloud-init schema
  # --system` -> "write_files.1.permissions: 493 is not of type 'string'").
  # chmod it in runcmd instead.
  - path: /usr/local/sbin/docker-user-fw.sh
    content: |
      #!/bin/sh
      # Drop new inbound connections to Docker-published ports arriving on the
      # multipass NAT NIC (tailscale0/lo/bridge traffic is untouched); on Multipass,
      # additionally allow new connections from the Mac's bridge address to those
      # ports and to et (2022) — that address is the box's own default gateway, so
      # it survives an IP change without a relaunch. MAC_ACCESS is baked in at
      # launch by the launcher: Multipass -> "gateway"; a future VPS launcher would
      # leave it "none" and keep the plain drop-all (D6).
      set -eu
      MAC_ACCESS="@@MAC_ACCESS@@"
      IF=$(ip -br link | awk '/^enp/{print $1; exit}')
      [ -n "$IF" ] || { echo "docker-user-fw: no enp* interface found" >&2; exit 1; }

      iptables -C DOCKER-USER -i "$IF" -m conntrack --ctstate NEW -j DROP 2>/dev/null \
        || iptables -I DOCKER-USER -i "$IF" -m conntrack --ctstate NEW -j DROP

      if [ "$MAC_ACCESS" = "gateway" ]; then
        GW=$(ip route show default | awk '{print $3; exit}')
        [ -n "$GW" ] || { echo "docker-user-fw: MAC_ACCESS=gateway but no default gateway found" >&2; exit 1; }
        # Idempotent for the current GW: -C checks before inserting, so a re-run
        # with the same address adds nothing twice. If the Mac's bridge address
        # ever changes, the old ACCEPT/ufw rule is harmless leftover (an allow for
        # an address nothing uses any more) rather than something actively cleaned
        # up here — acceptable for a disposable dev box; a relaunch clears it.
        iptables -C DOCKER-USER -i "$IF" -s "$GW" -m conntrack --ctstate NEW -j ACCEPT 2>/dev/null \
          || iptables -I DOCKER-USER 1 -i "$IF" -s "$GW" -m conntrack --ctstate NEW -j ACCEPT

        ufw allow in on "$IF" from "$GW" to any port 2022 proto tcp comment 'et from Mac bridge' >/dev/null 2>&1 || true
      fi
  - path: /etc/systemd/system/docker-user-fw.service
    content: |
      [Unit]
      Description=Reconcile the DOCKER-USER chain and et's ufw rule for the NAT NIC
      After=docker.service network-online.target
      Wants=network-online.target
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/docker-user-fw.sh

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Chrony fix (fleet-topology.md gotcha 1): /etc/chrony/chrony.conf sets
  # `makestep 1 3` AFTER its own confdir line, so a conf.d/*.conf drop-in never
  # wins — edit chrony.conf's own makestep line directly, then restart.
  - sed -i 's/^makestep .*/makestep 1.0 -1/' /etc/chrony/chrony.conf
  - systemctl restart chrony
  # Docker Engine + Compose plugin (native, no colima on Linux)
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - chmod 0755 /usr/local/sbin/docker-user-fw.sh
  - systemctl daemon-reload
  - systemctl enable --now docker-user-fw.service
  # Eternal Terminal: reconnect-surviving remote shells (`et @@VM_NAME@@` from any Mac).
  # et keeps the connection alive; herdr (a mise tool) keeps the sessions alive.
  # add-apt-repository fetches the PPA key from Launchpad and embeds it in the
  # .sources file; verify it against the fingerprint Launchpad publishes for
  # ~jgmath2000/et before installing anything signed by it.
  - add-apt-repository -y ppa:jgmath2000/et
  - sh -c 'f=$(ls /etc/apt/sources.list.d/jgmath2000-ubuntu-et-*.sources); fpr=$(sed -n "/BEGIN PGP/,/END PGP/p" "$f" | sed "s/^ //; s/^\.\$//" | gpg --show-keys --with-colons | grep "^fpr" | head -n1 | cut -d":" -f10); [ "$fpr" = "D3614CB0B3C2D154356BD436CB4ADEA5B72A07A1" ] || { echo "et PPA fingerprint mismatch ($fpr)"; rm -f "$f"; exit 1; }'
  - apt-get install -y et
  # zsh as the login shell, so `ssh @@VM_NAME@@` lands in the managed ~/.zshrc
  - chsh -s /usr/bin/zsh ubuntu
  # mise for the default user (runtime versions pinned later from the repo).
  # Activated for bash too: chezmoi's bootstrap scripts run from a bare shell.
  - su - ubuntu -c 'curl -fsSL https://mise.jdx.dev/install.sh | sh'
  - su - ubuntu -c 'echo '\''eval "$(~/.local/bin/mise activate bash)"'\'' >> ~/.bashrc'
  # ufw rules staged, then enabled below in the same boot — order matters: the
  # multipass NAT NIC port-22 allow rule must exist BEFORE `ufw enable`, or
  # `multipass stop`/`shell`/`exec` becomes a hard power-off the moment ufw comes
  # up. docker-user-fw.service (started above) already staged its own rules
  # (DOCKER-USER accept/drop, and on Multipass the et/2022 ufw allow) before we
  # get here.
  - ufw default deny incoming
  - ufw allow in on lo
  - sh -c 'IF=$(ip -br link | awk "/^enp/{print \$1; exit}"); ufw allow in on $IF to any port 22 proto tcp comment "multipass control channel"'
  - ufw --force enable

final_message: "cloud-init done for @@VM_NAME@@. Manual next steps (provision/README.md): seed ~/.config/chezmoi/key.txt; generate ~/.ssh/id_ed25519 and register it with gh; sh -c \"$(curl -fsLS get.chezmoi.io/lb)\" -- init --apply shahwan42/shdots. provision/new-box automates all of this."
