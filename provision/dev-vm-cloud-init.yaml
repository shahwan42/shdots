# Cloud-init for a dev VM — one template, every dev box (fdx-dev on the work Host,
# as-dev on the personal Host). Nothing here is machine-specific: identity comes from
# the multipass --name flag and `tailscale up --hostname=<name>` afterwards.
#
# NOT a chezmoi template despite the .tmpl suffix — `provision` is excluded in
# .chezmoiignore.tmpl, so chezmoi never renders or applies this. The `@@`-delimited
# placeholders are substituted by provision/launch-dev-vm.sh, which is the only
# supported way to use this file:
#
#   ./launch-dev-vm.sh as-dev                 # personal VM, defaults below
#   ./launch-dev-vm.sh fdx-dev --memory 10G --disk 160G   # work VM, as originally built
#
# NOTE: `package_upgrade: true` means two launches weeks apart get different package
# sets — "reproducible" here means same shape, not bit-identical.
#
# Deliberately NOT in this file (interactive or decision-gated):
#   - `tailscale up --ssh --hostname=...`  (needs browser auth + admin approval)
#   - `ufw enable`                          (enabled manually AFTER tailscale0 exists
#                                            and after verifying the multipass NIC
#                                            allow rule — see handover step 6)
#   - chezmoi bootstrap + role/kind answers (prompts; see provision/README.md)
#   - age identity, SSH keys, GITHUB_TOKEN  (secrets, seeded out-of-band)
#   - PHP/Node versions via mise            (pinned from the repo's constraints after clone)

timezone: Asia/Riyadh

# Direct SSH from the Host (ubuntu@<vm-ip>) — do not depend on `multipass exec`:
# with Docker installed in the guest, the multipass client can pick the docker0
# bridge IP (172.17.0.1) and fail with "No route to host". Field-tested 2026-08-25.
# The key is the LAUNCHING Host's own public key, injected by launch-dev-vm.sh, so
# each VM trusts the Mac that created it (id_ed25519.pub if present, else id_rsa.pub;
# --pubkey overrides).
ssh_authorized_keys:
  - @@HOST_SSH_PUBKEY@@

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - build-essential
  - ufw
  - chrony
  # provides add-apt-repository, used below for the Eternal Terminal PPA
  - software-properties-common
  # zsh is the login shell on every machine class (dot_zshrc.tmpl is applied
  # unconditionally). Installing it here means a fresh VM is not stuck on bash
  # waiting for a manual apt install + chsh.
  - zsh
  # Headless-chromium runtime libs. mermaid-cli (mmdc) renders through
  # Playwright's arm64 chromium and that binary is dynamically linked against
  # these. Without them mmdc fails at launch, not at install.
  - libatk1.0-0t64
  - libatk-bridge2.0-0t64
  - libatspi2.0-0t64
  - libcups2t64
  - libasound2t64
  - libgbm1
  - libcairo2
  - libpango-1.0-0
  - libxcomposite1
  - libxdamage1
  - libxfixes3
  - libxrandr2

swap:
  filename: /swapfile
  size: 4G
  maxsize: 4G

apt:
  sources:
    docker:
      source: "deb [signed-by=$KEY_FILE] https://download.docker.com/linux/ubuntu $RELEASE stable"
      keyid: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88

write_files:
  # Host sleep freezes the guest clock; on wake it can be behind by hours and
  # timesyncd's backed-off polling leaves a long wrong-clock window (TLS/apt/token
  # failures). chrony with unrestricted makestep fixes it promptly.
  - path: /etc/chrony/conf.d/99-vm.conf
    content: |
      makestep 1.0 -1
  # Security updates only is the Ubuntu default; never auto-reboot — a surprise
  # reboot takes down the whole stack (see architecture doc, Day-2 operations).
  - path: /etc/apt/apt.conf.d/51-no-auto-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
  # ufw does NOT filter Docker-published ports (they bypass INPUT via DOCKER chains).
  # This unit drops new inbound connections to containers arriving on the multipass
  # NAT NIC; tailscale0/lo/bridge traffic is untouched. Interface name is looked up
  # at runtime rather than hardcoded.
  - path: /etc/systemd/system/docker-user-fw.service
    content: |
      [Unit]
      Description=Drop container-published ports on the multipass NAT interface
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/bin/sh -c 'IF=$(ip -br link | awk "/^enp/{print \$1; exit}"); iptables -C DOCKER-USER -i $IF -m conntrack --ctstate NEW -j DROP 2>/dev/null || iptables -I DOCKER-USER -i $IF -m conntrack --ctstate NEW -j DROP'

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Docker Engine + Compose plugin (native, no colima on Linux)
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl daemon-reload
  - systemctl enable --now docker-user-fw.service
  # Tailscale from its signed apt repo (no curl|sh); `tailscale up` stays manual.
  # The downloaded keyring is verified against Tailscale's published signing-key
  # fingerprint before apt ever trusts it — a mismatch removes it and fails here.
  - sh -c '. /etc/os-release; curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/${VERSION_CODENAME}.noarmor.gpg" -o /usr/share/keyrings/tailscale-archive-keyring.gpg'
  - sh -c 'fpr=$(gpg --show-keys --with-colons /usr/share/keyrings/tailscale-archive-keyring.gpg | grep "^fpr" | head -n1 | cut -d":" -f10); [ "$fpr" = "2596A99EAAB33821893C0A79458CA832957F5868" ] || { echo "tailscale keyring fingerprint mismatch ($fpr)"; rm -f /usr/share/keyrings/tailscale-archive-keyring.gpg; exit 1; }'
  - sh -c '. /etc/os-release; curl -fsSL "https://pkgs.tailscale.com/stable/ubuntu/${VERSION_CODENAME}.tailscale-keyring.list" -o /etc/apt/sources.list.d/tailscale.list'
  - apt-get update && apt-get install -y tailscale
  # Eternal Terminal: reconnect-surviving remote shells (`et @@VM_NAME@@` from any Mac).
  # et keeps the connection alive; herdr (a mise tool) keeps the sessions alive.
  # add-apt-repository fetches the PPA key from Launchpad and embeds it in the
  # .sources file; verify it against the fingerprint Launchpad publishes for
  # ~jgmath2000/et before installing anything signed by it.
  - add-apt-repository -y ppa:jgmath2000/et
  - sh -c 'f=$(ls /etc/apt/sources.list.d/jgmath2000-ubuntu-et-*.sources); fpr=$(sed -n "/BEGIN PGP/,/END PGP/p" "$f" | sed "s/^ //; s/^\.\$//" | gpg --show-keys --with-colons | grep "^fpr" | head -n1 | cut -d":" -f10); [ "$fpr" = "D3614CB0B3C2D154356BD436CB4ADEA5B72A07A1" ] || { echo "et PPA fingerprint mismatch ($fpr)"; rm -f "$f"; exit 1; }'
  - apt-get install -y et
  # zsh as the login shell, so `ssh @@VM_NAME@@` lands in the managed ~/.zshrc
  - chsh -s /usr/bin/zsh ubuntu
  # mise for the default user (runtime versions pinned later from the repo).
  # Activated for bash too: chezmoi's bootstrap scripts run from a bare shell.
  - su - ubuntu -c 'curl -fsSL https://mise.jdx.dev/install.sh | sh'
  - su - ubuntu -c 'echo '\''eval "$(~/.local/bin/mise activate bash)"'\'' >> ~/.bashrc'
  # ufw rules staged but NOT enabled (see header). The multipass NIC port-22 allow
  # keeps `multipass shell/exec/stop` working after enable — losing it turns every
  # `multipass stop` into a hard power-off.
  - ufw default deny incoming
  - ufw allow in on lo
  - ufw allow in on tailscale0
  - ufw allow 41641/udp comment 'tailscale direct (avoids DERP relay)'
  - sh -c 'IF=$(ip -br link | awk "/^enp/{print \$1; exit}"); ufw allow in on $IF to any port 22 proto tcp comment "multipass control channel"'

final_message: "cloud-init done for @@VM_NAME@@. Manual next steps (provision/README.md): tailscale up --ssh --hostname=@@VM_NAME@@; tailscale set --auto-update; seed ~/.config/chezmoi/key.txt; generate ~/.ssh/id_ed25519_*; GITHUB_TOKEN in ~/.zshrc.local; sh -c \"$(curl -fsLS get.chezmoi.io/lb)\" -- init --apply shahwan42/shdots; ufw enable (verify multipass shell still works!)."
