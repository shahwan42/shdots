# Public halves of each machine's primary SSH key (the one .chezmoitemplates/ssh-self-key
# names). Public keys only — private keys stay unmanaged, per .chezmoiignore.tmpl's
# `.ssh/id_*` rule. Used to build ~/.ssh/authorized_keys reproducibly.
#
# Workstations only. Dev boxes are disposable and rotate their keys on every
# rebuild, so they are deliberately not recorded here and never trusted by a Mac.
# Only fdx_host is consumed (as-host's authorized_keys); as_host is for reference.
# Refresh a value after rotating a key: ssh <machine> 'cat ~/.ssh/<key>.pub'
fleet:
  as_host: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEhQp/z4IWR3QErs/LUlgiAvb2SFiZbn+MhC3xKpGuNR"
  fdx_host: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKdvXIPdFlQHPsGTNhiZH8PfKIyOG71d6HLv+F+4FmLE"
