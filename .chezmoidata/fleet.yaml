  as_host: "ssh-rsa "
  fdx_host: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKdvXIPdFlQHPsGTNhiZH8PfKIyOG71d6HLv+F+4FmLE"
  as_dev: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBAo3ZxqkZuQvZ8Sm/Y/mZgBrvaFkNSMAN/nXPh87WLo"
  fdx_dev: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEYlShaMj2ca3pGcyVnj0pwUlEAxWTTP3u7JflLUJ0iC"
