# Desired Herdr state per machine, consumed by
# run_onchange_after_45-herdr-plugins.sh.tmpl.
#
# Per host:
#   enabled      false -> the reconcile script does nothing on this host.
#   mode         client    = control plane, attaches to remote execution servers
#                execution = agents + plugins run locally
#                none      = Herdr not used here
#   plugins      list of { source, ref, rev } — see below. Only execution hosts
#                carry plugins; a client host keeps this empty (remote plugins
#                belong on the execution server they run against).
#   integrations names for `herdr integration install <name>`.
#
# Plugin entries are version-pinned and reconciled with the documented
# mechanism, `herdr plugin install <source> --ref <REF>`:
#   source  GitHub "<owner>/<repo>".
#   ref     what --ref receives: a release tag where the plugin cuts sensible
#           releases, otherwise the exact known-good commit.
#   rev     the full commit `ref` resolves to = the currently installed,
#           known-good revision. The script compares this against
#           `herdr plugin list --json` .resolved_commit for drift detection,
#           offline. For a commit-pinned entry ref == rev.
#
# Only as-dev is onboarded. as-host is a client placeholder; fdx-* are disabled.
# Do NOT populate the others from this machine.

herdr:
  hosts:
    as-host:
      enabled: true
      mode: client
      plugins: []
      integrations: []

    as-dev:
      enabled: true
      mode: execution
      plugins:
        # reviewr / agent-usage / workflows / automatic-rename: installed rev == a release tag.
        - { source: persiyanov/herdr-reviewr,          ref: v0.36.2, rev: 4c090225af706bf3aaa24b39fea890a72994f40f }
        - { source: senna-lang/herdr-agent-usage,       ref: v0.5.13, rev: df95abc0ba2edb002697d49a218868f87f823a3e }
        - { source: aorumbayev/herdr-workflows,          ref: v0.14.0, rev: 3a218fce44f73caf6045b01d4e0628d8b06c6cfe }
        # Pure bash/jq plugin (no build step, no toolchain). Names tabs after
        # directory > branch > agent task and prefixes workspaces/tabs with the
        # [1-9] jump key. Defaults match the desired workflow, so no config.sh;
        # the shell hook is loaded from dot_config/zsh/functions.
        - { source: qu8n/herdr-automatic-rename,        ref: v0.8.0,  rev: e241443d9bc29d717c0a9edec281f2b92692a279 }
        # token-dashboard / lazygit: installed rev is an untagged commit past
        # the latest release; pin the commit so we keep the known-good build
        # without an upgrade.
        - { source: Davidcreador/herdr-token-dashboard, ref: 845061589bfef53df4312f67a1e7336e5e47cd8c, rev: 845061589bfef53df4312f67a1e7336e5e47cd8c }
        - { source: crokily/herdr-lazygit,               ref: a13e12c99e5e469edd73165cabba413c2a2fd698, rev: a13e12c99e5e469edd73165cabba413c2a2fd698 }
      integrations:
        - claude
        - codex
        - opencode

    fdx-host:
      enabled: false
      mode: none
      plugins: []
      integrations: []

    fdx-dev:
      enabled: false          # not onboarded — install nothing here yet
      mode: execution
      plugins: []
      integrations: []
